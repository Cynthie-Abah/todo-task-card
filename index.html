<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section
      role="region"
      id="todo-card"
      class="card-container"
      data-testid="test-todo-card"
    >
      <div class="top-section">
        <!-- left  -->
        <div class="left-section">
          <span
            class="priority-badge high"
            data-testid="test-todo-priority-indicator"
            data-testid="test-todo-priority"
            >High priority</span
          >
          <ul role="list" class="tags" data-testid="test-todo-tags">
            <li data-testid="test-todo-tag-work" class="selected">Work</li>
            <li data-testid="test-todo-tag-urgent">Urgent</li>
            <li data-testid="test-todo-tag-design">Design</li>
          </ul>
        </div>

        <!-- right -->
        <input
          aria-label="mark-as-done"
          name="mark-as-done"
          type="checkbox"
          role="checkbox"
          data-testid="test-todo-complete-toggle"
          id="mark-as-done"
        />
      </div>

      <div class="status-control" data-testid="test-todo-status-control">
        <button type="button" class="active" data-status="pending">
          Pending
        </button>
        <button type="button" data-status="in-progress">In Progress</button>
        <button type="button" data-status="done">Done</button>
      </div>

      <h2 class="task-title" data-testid="test-todo-title">
        Launch Social Media Campaign
      </h2>
      <div
        class="description-container"
        data-testid="test-todo-collapsible-section"
      >
        <p class="task-description" data-testid="test-todo-description">
          Prepare visuals and copy for the "30 Days of Productivity" campaign
          across Instagram, Linkedin, and X. Schedule all posts for automated
          publishing.
        </p>

        <button
          class="description-toggle-btn"
          data-testid="test-todo-expand-toggle"
          aria-expanded="false"
          aria-controls="todo-description"
        >
          Expand
        </button>
      </div>

      <ul class="time-info" role="list">
        <li>
          <time
            datetime="2026-02-18T12:00:00"
            id="due-date"
            data-testid="test-todo-due-date"
            >Due May 18, 2026 18:00 UTC</time
          >
        </li>
        <li>
          <time
            aria-live="polite"
            datetime=""
            data-testid="test-todo-time-remaining"
            id="timeRemaining"
            >Due in 3 days</time
          >
        </li>
      </ul>
      <div class="overdue-indicator" data-testid="test-todo-overdue-indicator">
        Overdue!
      </div>

      <div id="status-indicator" class="pending" data-testid="test-todo-status">
        pending
      </div>

      <div>
        <button class="edit" data-testid="test-todo-edit-button">Edit</button>
        <button class="delete" data-testid="test-todo-delete-button">
          Delete
        </button>
      </div>
    </section>

    <!-- EDIT VIEW -->
    <section
      role="region"
      id="edit-view"
      class="card-container hide-card"
      data-testid="test-todo-edit-form"
    >
      <form action="">
        <div class="input-div">
          <label for="title-input">Title</label>
          <input
            id="title-input"
            data-testid="test-todo-edit-title-input"
            type="text"
          />
        </div>

        <div class="input-div">
          <label for="description-input">Description</label>
          <textarea
            id="description-input"
            data-testid="test-todo-edit-description-input"
          ></textarea>
        </div>

        <div>
          <label for="priority-input">Priority</label>
          <select
            id="priority-input"
            data-testid="test-todo-edit-priority-select"
          >
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div>
          <label for="due-date-input">Due Date</label>
          <input
            id="due-date-input"
            data-testid="test-todo-edit-due-date-input"
            type="datetime-local"
          />
        </div>

        <div class="btns">
          <button class="save-btn" data-testid="test-todo-save-button">
            Save
          </button>
          <button class="cancel-btn" data-testid="test-todo-cancel-button">
            Cancel
          </button>
        </div>
      </form>
    </section>

    <script src="main.js"></script>
  </body>
</html>
