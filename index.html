<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section role="region" class="card-container" data-testid="test-todo-card">
      <div class="top-section">
        <!-- left  -->
        <div class="left-section">
          <span class="priority-badge high" data-testid="test-todo-priority"
            >High priority</span
          >
          <ul role="list" class="tags" data-testid="test-todo-tags">
            <li data-testid="test-todo-tag-work" class="selected">Work</li>
            <li data-testid="test-todo-tag-urgent">Urgent</li>
            <li data-testid="test-todo-tag-design">Design</li>
          </ul>
        </div>

        <!-- right -->
        <input
          aria-label="mark-as-done"
          name="mark-as-done"
          type="checkbox"
          role="checkbox"
          data-testid="test-todo-complete-toggle"
          id="mark-as-done"
        />
      </div>

      <h2 class="task-title" data-testid="test-todo-title">
        Launch Social Media Campaign
      </h2>

      <p class="task-description" data-testid="test-todo-description">
        Prepare visuals and copy for the "30 Days of Productivity" campaign
        across Instagram, Linkedin, and X. Schedule all posts for automated
        publishing.
      </p>
      <ul class="time-info" role="list">
        <li>
          <time
            datetime="2026-02-18T12:00:00"
            id="due-date"
            data-testid="test-todo-due-date"
            >Due May 18, 2026 18:00 UTC</time
          >
        </li>
        <li>
          <time
            aria-live="polite"
            datetime=""
            data-testid="test-todo-time-remaining"
            id="timeRemaining"
            >Due in 3 days</time
          >
        </li>
      </ul>

      <div id="status-indicator" class="pending" data-testid="test-todo-status">
        pending
      </div>

      <div>
        <button class="edit" data-testid="test-todo-edit-button">Edit</button>
        <button class="delete" data-testid="test-todo-delete-button">
          Delete
        </button>
      </div>
    </section>

    <script src="main.js"></script>
  </body>
</html>
